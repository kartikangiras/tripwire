[project]
name = "tripwire"
version = "0.1.0"
description = "A provenance monitor for agent swarms"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["ai-safety", "multi-agent", "provenance", "oversight", "agents"]
dependencies = ["huggingface-hub", "polars", "orjson", "networkx"]

[project.scripts]
tripwire = "tripwire.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripwire"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
